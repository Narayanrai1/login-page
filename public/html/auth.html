<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Login</title>

    <style>
        /* 🌈 Background animation */
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffcc);
            background-size: 600% 600%;
            animation: gradientMove 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* 🧊 Glass container */
        .container {
            width: 350px;
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
        }

        /* 🔥 Title */
        .container h2 {
            margin-bottom: 20px;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff00cc;
        }

        /* ✨ Input fields */
        .input-box {
            position: relative;
            margin: 30px 0;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            outline: none;
            color: white;
            font-size: 16px;
        }

        /* Floating label */
        .input-box label {
            position: absolute;
            top: 10px;
            left: 0;
            pointer-events: none;
            transition: 0.5s;
            color: #ccc;
        }

        .input-box input:focus~label,
        .input-box input:valid~label {
            top: -15px;
            font-size: 12px;
            color: #00ffcc;
        }

        /* 💡 Glow button */
        button {
            width: 100%;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px #ff00cc;
        }

        button:hover {
            box-shadow: 0 0 20px #ff00cc, 0 0 40px #3333ff;
            transform: scale(1.05);
        }

        /* 👾 Extra text */
        .container p {
            margin-top: 15px;
            font-size: 14px;
        }

        .container p a {
            color: #00ffcc;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <form action="/auth" method="POST">
        <div class="container">
            <h2>LOGIN</h2>


            <div class="input-box">
                <input type="text" required name="user">
                <label>Username</label>
            </div>

            <div class="input-box">
                <input type="password" required name="pwd">
                <label>Password</label>
            </div>

            <button type="submit" action="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
  

</body>

</html>
