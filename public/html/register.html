<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;

            /* 🌈 animated background */
            background: linear-gradient(-45deg, #6a11cb, #2575fc, #ff00cc, #00ffcc);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* 🧊 Glass box */
        .box {
            display: flex;
            flex-direction: column;
            width: 350px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            align-items: center;
            gap: 20px;
        }

        h2 {
            color: white;
            margin: 0;
        }

        .input {
            width: 100%;
            height: 40px;
            border-radius: 20px;
            border: none;
            padding-left: 15px;
            outline: none;
        }

        .button {
            background: #00ffcc;
            border-radius: 25px;
            width: 100%;
            height: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .back {
            color: white;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

    </style>
</head>

<body>

<form action="/register" method="POST">
    <div class="box">
        <h2>Sign Up 🚀</h2>

        <!-- ⚠️ SAME name as your backend expects -->
        <input class="input" name="user" type="text" placeholder="Username" required>

        <input class="input" name="pwd" type="password" placeholder="Password" required>

        <button class="button" type="submit">Create Account</button>

        <a class="back" href="/">← Back to Home</a>
    </div>
</form>

</body>
</html>
