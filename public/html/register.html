<!DOCTYPE html>
<html>
    <head>
        <style>
            .box
            {
                display: flex;
                flex-direction:column;
                width: 500px;
                height: 240px;
                background-color: pink;
                border-radius: 50px;
                box-shadow: 5px 5px 5px;
                align-items: center;
                gap: 20px;
                /* justify-content: space-around; */
            }
            .username
            {
                width: 290px;
                height: 25px;
                border-radius: 25px;
                padding-left: 10px;
                margin-top: 50px;
                

            }
            .password
            {

                width: 290px;
                height: 25px;
                border-radius: 25px;
                padding-left: 10px;
            }
            .button
            {
                margin-top: 30px;
                background-color: blue;
                border-radius: 10px;
                width: 85px;
                height: 30px;
            }
        </style>
    </head>
    <body>
        <form action="/register" method="POST">
        <div class="box">
            <div>
                <input class="username" name="user" type="text" placeholder="username">
            </div>
            <div>
                <input class="password" name="pwd" type="text" placeholder="password">
            </div>
            <div>
                <button class="button" type="submit">SUBMIT</button>
            </div>

        </div>
        </form>
    </body>
</html>
